services:
  postgres:
    image: postgres:16
    container_name: puchurl-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: puchurl
    ports:
      - "5432:5432"
    volumes:
      - puchurl-pgdata:/var/lib/postgresql/data

volumes:
  puchurl-pgdata: